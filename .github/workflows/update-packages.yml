name: Update packages

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-packages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    env:
      GH_TOKEN: ${{ github.token }}
      COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
      PACKAGER: ${{ vars.PACKAGER || 'Max Enelund <max@ig4.se>' }}
    steps:
      - name: Install tools
        run: dnf -y install copr-cli gh git python3 rpm-build rpmdevtools

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Configure Copr
        run: |
          if [ -z "$COPR_CONFIG" ]; then
            echo "::warning::COPR_CONFIG secret is not set; skipping"
            exit 0
          fi
          mkdir -p "$HOME/.config"
          printf '%s\n' "$COPR_CONFIG" > "$HOME/.config/copr"
          chmod 600 "$HOME/.config/copr"

      - name: Update packages
        run: |
          if [ -z "$COPR_CONFIG" ]; then
            echo "::warning::COPR_CONFIG secret is not set; skipping"
            exit 0
          fi
          python3 scripts/update_packages.py
